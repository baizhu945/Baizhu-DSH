# dsh.nix manages this profile overlay.
- insert:
    - id: confirm-writes
      name: './plugins/confirm-writes.mjs'
      config:
        preset: confirm
        askTools:
          - write
          - edit
          - str_replace_editor
          - bash
          - pwsh
          - terminal_send

    - id: openai-codex-account
      name: './plugins/openai-codex-account.mjs'
      inject: [llm, commands]

# Keep the DSH built-in modes and add the Web profile's fourth mode.
- id: permission
  config:
    defaultPreset: confirm
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      confirm:
        sandbox: danger-full-access
        approval: ask
        name: Confirm (ask)
        description: Full access, but every write and command asks for your approval

# 由 home-manager 管理(agent/dsh/dsh.nix)。
# 追加自定义 patch 行请编辑 dsh.nix。
- insert:
    - id: confirm-writes
      name: './plugins/confirm-writes.mjs'
      config:
        # 仅在此预设(第四模式)下拦截写/执行
        preset: confirm
        askTools:
          - write
          - edit
          - str_replace_editor
          - bash
          - pwsh
          - terminal_send

    # 审批面板插件(approval-always-allow + approval-keyboard 两个源码补丁
    # 的插件迁移):内置面板仍可工作,本插件以 composer chain 更高优先级
    # 接管审批 UI,提供「总是允许」第三按钮与 Esc/Ctrl+Enter 快捷键。
    # 双半包:host 半体为空,client 半体经 package.json 的 dsh.client 声明加载
    # (包本体由 home-manager 安装到本 profile 的 node_modules)。
    - id: approval-tweaks
      name: 'dsh-baizhu-approval'

    # OpenAI 账号登录插件:注册 openai-codex provider(ChatGPT Plus/Pro token
    # plan),提供 /openai-login、/openai-logout、/openai-status 命令。
    # 真实文件部署见 dsh.nix home.activation.dshPlugins(不能是符号链接)。
    - id: openai-codex-account
      name: './plugins/openai-codex-account.mjs'

    # OpenAI 账号登录的 Web UI 分节(设置 → OpenAI 账号):浏览器半体通过
    # dsh.client 自动加载,host 半体为空。包文件部署见 dsh.nix
    # home.activation.dshPlugins(真实拷贝到 web profile node_modules)。
    - id: openai-account-ui
      name: 'dsh-openai-account-ui'

    # 上游 skin-center 自带全部内置皮肤，单独安装不引入其它 Web UI 组件。
    - id: ui-skin-center
      name: '@linxin666/dsh-client-ui-skin-center'

# ── 权限预设表 ──────────────────────────────────────────────────────────
# dsh 三个内置模式保持原样(Read Only / Workspace Write / Full Access);
# 新增第四模式 confirm = 无沙箱边界 + 每次写/执行询问(配合 confirm-writes 插件)。
# defaultPreset: confirm → 新会话默认启用询问模式。
- id: permission
  config:
    defaultPreset: confirm
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      confirm:
        sandbox: danger-full-access
        approval: ask
        name: Confirm (ask)
        description: Full access, but every write and command asks for your approval

# approval 服务默认策略固定为 ask,保证新会话/回退场景下写/执行始终可询问
- id: approval
  config:
    policy: ask

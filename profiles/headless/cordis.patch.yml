# Home Manager owns the headless profile overlay. Keep upstream startup,
# runner, tools, and JSON output rather than the removed cc-connect JSONL bridge.
# The profile's private package.json has no version, which prevents the
# optional package-inventory diagnostic from preparing requests.
- id: plugin-package-inventory-deepseek
  config:
    enabled: false

# Reuse the same OAuth provider as Web/TUI for existing subscription accounts.
# A noninteractive headless run consumes saved credentials only.
- insert:
    - id: dsh-auth
      name: '@deepseek-harness-tui/dsh-auth'
      inject: [llm, commands]
